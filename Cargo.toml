[package]
name = "publishkit"
version = "0.1.47"
edition = "2021"
license-file = "LICENSE"

[dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }
# What every mayorana desktop app shares: statistics, update check, notice and
# licence. Beside this repository; CI checks it out there at a pinned tag.
desktop-kit = { path = "../desktop-kit", features = ["ui"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
chrono = "0.4"
directories = "5.0"
# Locates the shared mayorana folder for usage statistics, like the other apps.
# Already in the tree at this version.
dirs = "6"
rfd = "0.15"
pulldown-cmark = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"
base64 = "0.22"
# Signing Ghost Admin API tokens (HMAC-SHA256). Both already in the tree.
sha2 = "0.10"
hex = "0.4"
# The anonymous install id for usage statistics: 128 random bits. Already
# in the tree via other crates, so this names a dependency rather than adding one.
getrandom = "0.3"
imagesize = "0.15.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
# The same lints in every desktop app. A panic is a crash the user sees, so unwrap and expect
# are refused outside tests, as is unsafe code without a SAFETY comment. Where one is right
# (a constant that cannot fail), allow it on that item and say why.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
